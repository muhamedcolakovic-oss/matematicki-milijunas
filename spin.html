<!doctype html>
<html lang="bs">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Spin The Wheel</title>
<link rel="icon" type="image/png" href="spin.png">


<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&family=Fraunces:wght@700;900&display=swap" rel="stylesheet">


<link rel="stylesheet" href="spin.css">

</head>


<body>


<div class="math-background"></div>



<nav class="game-nav">

<button onclick="history.back()">
← Nazad
</button>

</nav>




<div class="spin-container">



<div class="wheel-section">


<div class="wheel-box">


<canvas id="wheel-canvas"></canvas>


<div class="pointer"></div>


</div>




<div class="spin-area">

<button id="spin-btn" class="spin-btn">

🎡 SPIN

</button>

</div>



</div>





<div class="player-card">


<h1>
Dodaj igrače
</h1>


<p>
Izaberi pobjednika
</p>




<div class="add-box">


<input 
id="player-input"
placeholder="Ime igrača"
>



<button id="add">
+
</button>


</div>



<div id="player-list"></div>

<div id="player-count">
    👥 <span>0</span> TAKMIČARA
</div>

</div>





</div>







<div class="overlay" id="overlay">


<div class="popup">


<h1>
🏆 Pobjednik
</h1>


<div id="winner"></div>



<button onclick="closePopup()">
OK
</button>
<button onclick="removeWinner()" 
style="margin-right:10px;">
Izbriši 🗑
</button>

</div>


</div>





<script src="spin.js"></script>


</body>

</html>
